<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Layanan - Sistem Komisi Barbershop</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-logo">

                <h2>
                    BARBERSHOP
                </h2>

                <p>
                    Accounting System
                </p>

            </div>

            <nav class="sidebar-nav">

                <a href="index.html">
                    Dashboard
                </a>

                <a href="kapster.html">
                    Master Kapster
                </a>

                <a
                    href="layanan.html"
                    class="active"
                >
                    Master Layanan
                </a>

                <a href="transaksi.html">
                    Transaksi
                </a>

                <a href="riwayat.html">
                    Riwayat Transaksi
                </a>

                <a href="laporan.html">
                    Laporan Komisi
                </a>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <div class="page-header">

                <h1>
                    Master Data Layanan
                </h1>

                <p>
                    Kelola layanan, harga, dan persentase komisi kapster.
                </p>

            </div>


            <!-- FORM -->
            <div class="card">

                <h3 id="formTitle">
                    Tambah Layanan
                </h3>

                <form id="layananForm">

                    <input
                        type="hidden"
                        id="layananId"
                    >


                    <div class="form-group">

                        <label for="namaLayanan">
                            Nama Layanan
                        </label>

                        <input
                            type="text"
                            id="namaLayanan"
                            placeholder="Contoh: Haircut"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="harga">
                            Harga
                        </label>

                        <input
                            type="number"
                            id="harga"
                            min="0"
                            step="1000"
                            placeholder="Contoh: 30000"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="persentaseKomisi">
                            Persentase Komisi (%)
                        </label>

                        <input
                            type="number"
                            id="persentaseKomisi"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="Contoh: 40"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select id="status">

                            <option value="aktif">
                                Aktif
                            </option>

                            <option value="nonaktif">
                                Nonaktif
                            </option>

                        </select>

                    </div>


                    <button type="submit">
                        Simpan
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        onclick="resetForm()"
                        style="display: none;"
                    >
                        Batal
                    </button>

                </form>

                <p id="message"></p>

            </div>


            <!-- DATA -->
            <div class="card">

                <h3>
                    Daftar Layanan
                </h3>

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>No</th>
                                <th>Nama Layanan</th>
                                <th>Harga</th>
                                <th>Komisi</th>
                                <th>Status</th>
                                <th>Aksi</th>

                            </tr>

                        </thead>

                        <tbody id="layananTable">

                            <tr>

                                <td colspan="6">
                                    Loading...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/layanan.js"></script>

</body>

</html>
